services:
  api:
    build:
      context: api
      dockerfile: api.Dockerfile
    volumes:
      - ./api:/app
    command: go run main.go
    ports:
      - "8888:8080"
    environment:
      - CONFIG_PATH=./config/local.yaml
      - REDIS_ADDR=redis:6379
      - REDIS_QUEUE_NAME=tg_transfer
    depends_on:
      - redis
  bot:
    build:
      context: ./bot
      dockerfile: bot.Dockerfile
    restart: always
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis:6379/0
      - REDIS_QUEUE_NAME=tg_transfer
      - BOT_TOKEN=${BOT_TOKEN}
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  redis_data:
