services:
  api:
    build:
      context: api
      dockerfile: api.Dockerfile
    volumes:
      - ./api:/app
    command: go run main.go
    ports:
      - "8888:8080"
    environment:
      - CONFIG_PATH=./config/local.yaml
      - REDIS_ADDR=redis:6379
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  redis_data:
